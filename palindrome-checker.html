<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Is palindrome ?</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="Projectnav"> <a href="index.html"> Home</a></div>

    <h1>We can checking the words !</h1>
    <div id="UI">
        <input type="text" id="inputString" placeholder="back words?">
        <button id="theButton">Check</button>
        <p id="feedback">le feedback ici..</p>
    </div>

    <script>
        console.clear();
        console.log("Bonjour!");

        const theFeedback = document.getElementById("feedback");
        theFeedback.innerHTML= "bla bla"

        const theButton = document.getElementById("theButton");
        theButton.addEventListener("click", checkTheText);
        
        function checkTheText(){
            console.log("We are checking the text!");
            
            const theInput = document.getElementById("inputString");
            console.log(theInput.value);

            checkPalindrome(theInput.value);

            if( theInput.value =="chaton"){
                console.log("yes.");
                theFeedback.innerHTML = "Error: input is a kitten";
            }

            else if( theInput.value == ""){
                theFeedback.innerHTML = "Fill in the form, dumbass";
            }
            else if (checkPalindrome(theInput.value)==true){
                console.log("yes");
                theFeedback.innerHTML = "Yeah " + theInput.value +" is a palindrome.";
            }

            else{
                console.log("no");
                theFeedback.innerHTML = "Non";
            }

            theInput.value=""; // vider après usage

        } //checkTheTExt

        function checkPalindrome(str){
            //console.log("palindrome check: " + str);

        str= str.replaceAll(" ", "");

        let theLetters = str.split("");
        let verlan = theLetters.reverse();
        let rts = verlan.join(""); //juste str à l'enver pour la vanne

    
        //console.log("rts ="+ rts);

        if( str == rts){
            return true;
        }

        else{
            return false;
        }
        }
    </script>

</body>
