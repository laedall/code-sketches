<!DOCTYPE html>
<html lang="en">
<head>
        <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web dev - color flipper</title>
    <style>
        body{
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
    </style>
</head>
<body>
        <script src="p5.js"></script>
    <script src="circle.js"></script>

    
    <h1>We can flipping the colors</h1>

    <button onClick="setColor('Papayawhip')">Papaya-Whip</button>
    <button onClick="setColor('Peachpuff')">Peach Puff</button></button>
    <button onClick="setColor('Powderblue')">Powder Blue</button>

    <br><br>

    <button onClick="randomColor()">Random</button>

    <script>
        const body = document.getElementsByTagName("body") [0];
        //body.style.backgroundColor = "papayawhip";

        //même fonction que sur la ligne ci-dessous mais elle permet d'être modifié ailleurs
        setColor("magenta");

        function setColor(name){
            body.style.backgroundColor = name;
        }

        function randomColor(){
            console.log("Hi!");
            let R = Math.round(Math.random()* 255);
            let V = Math.round(Math.random()* 255);
            let B = Math.round(Math.random()* 255);
            
            //plus stupide et chiante
            //let theColor= "rgb(" + R + ", " + V + ", " + B + ")";

            //plus simple
            let theColor = `rgb(${R} ${V}, ${B})`;
            body.style.backgroundColor = theColor;

            if(R+V+B < 400 ){
                body.style.color="white";
            }

            else{
                body.style.color="black";
            }


        }
    </script>

</body>
</html>
